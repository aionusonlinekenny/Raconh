	<script>
        // Redirect to login portal if no username (URL param or sessionStorage)
        (function() {
            var u = new URLSearchParams(window.location.search).get('username')
                    || sessionStorage.getItem('cw_game_user');
            if (!u) window.location.href = 'login.php';
        })();



        var version = Math.random();
		function showLoading()
		{
			Loading.init(version);
		}
		function setLoading(cur)
		{
            Loading.updateProgress(cur, 8);
		}
        function cleanLoading()
        {
            Loading.cleanAll();
        }






        var curAudio;

<body>
    <div id="egret-player" style="margin: auto;width: 100%;height: 100%;" class="egret-player"
         data-entry-class="Main"
         data-orientation="auto"
         data-scale-mode="showAll"
         data-content-width="720"
         data-content-height="1280"
         data-show-paint-rect="false"
         data-multi-fingered="2"
         data-show-fps="false" data-show-log="false"
         data-show-fps-style="x:0,y:200,size:12,textColor:0xffffff,bgAlpha:0.5">
    </div>
    <script>
        showLoading();
        var playerObj = document.getElementById("egret-player");
        var os = navigator.userAgent.toLowerCase();
        var frameRate;
        var isMobile = (os.indexOf('mobile') >= 0 || os.indexOf('android') >= 0);
        if (isMobile)
            frameRate = "30";
        else
            frameRate = "60";
        playerObj.setAttribute("data-frame-rate", frameRate);


        var loadScript = function (list, callback) {
            var loaded = 0;
            var loadNext = function () {
                loadSingleScript(list[loaded], function () {
                    loaded++;
                    if (loaded >= list.length) {
                        callback();
                    }
                    else {
                        loadNext();
                    }
                })
            };
            loadNext();
        };

        var loadSingleScript = function (src, callback) {
            var s = document.createElement('script');
            s.async = false;
            s.src = src + "?v=" + Math.random();
            s.addEventListener('load', function () {
                s.parentNode.removeChild(s);
                s.removeEventListener('load', arguments.callee, false);
                callback();
            }, false);
            document.body.appendChild(s);
        };

        var xhr = new XMLHttpRequest();
        xhr.open('GET', './manifest.json?v=' + version, true);
        xhr.addEventListener("load", function () {
            var manifest = JSON.parse(xhr.response);
            var list = manifest.initial.concat(manifest.game);
            // var list = ["thm.js"].concat(manifest.initial).concat(manifest.game);
            // var list = manifest.initial.concat(["thm.js"]).concat(manifest.game);
			loadScript(list, function () {
				/**
				 * {
				 * "renderMode":, //Engine rendering mode, "canvas" or "webgl"
				 * "audioType": 0 //Use the audio type, 0: default, 2: web audio, 3: audio
				 * "antialias": //Whether the anti-aliasing is enabled in WebGL mode, true: on, false: off, defaults to false
				 * "canvasScaleFactor": //canvas scale factor
				 * }
				 **/
                setLoading(1);
				egret.runEgret({ renderMode: "webgl", audioType: 3,screenAdapter:new ScreenAdapter()});
			});
		});
		xhr.send(null);
    </script>
</body>

</html>
