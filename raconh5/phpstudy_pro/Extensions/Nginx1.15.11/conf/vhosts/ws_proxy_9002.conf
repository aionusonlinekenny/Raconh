# WebSocket proxy for external game clients
# Game JS connects to ws://[location.hostname]:9002
# Nginx listens on 0.0.0.0:9002 (all interfaces) → proxies to Erlang at 127.0.0.1:19002
# Erlang must be started with GAME_PORT=19002 (see Start_Server.bat)
#
# To apply: copy this file to the nginx vhosts/ folder and run: nginx -s reload

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 9002;

    location / {
        proxy_pass             http://127.0.0.1:19002;
        proxy_http_version     1.1;

        # WebSocket upgrade headers (required)
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection $connection_upgrade;
        proxy_set_header       Host       $host;
        proxy_set_header       X-Real-IP  $remote_addr;

        # Long timeouts for real-time game connection
        proxy_read_timeout     600s;
        proxy_send_timeout     600s;
        proxy_connect_timeout  10s;

        # Disable buffering (WebSocket is streaming)
        proxy_buffering        off;
    }
}
