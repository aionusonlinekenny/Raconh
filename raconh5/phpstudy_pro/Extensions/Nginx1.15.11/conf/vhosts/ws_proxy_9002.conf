# WebSocket proxy — FOR NGINX USERS ONLY (NOT for XAMPP/Apache setups)
#
# If you use XAMPP: DO NOT use this file. Set GAME_BIND=0.0.0.0 in Start_Server.bat
# and Erlang will listen directly on port 9002 for all interfaces. No proxy needed.
#
# If you use nginx as your web server:
#   - Set GAME_PORT=19002 in Start_Server.bat (Erlang on internal port)
#   - Copy this file to the nginx vhosts/ folder
#   - Run: nginx -s reload
#   Nginx then listens on 0.0.0.0:9002 → proxies to Erlang at 127.0.0.1:19002

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 9002;

    location / {
        proxy_pass             http://127.0.0.1:19002;
        proxy_http_version     1.1;

        # WebSocket upgrade headers (required)
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection $connection_upgrade;
        proxy_set_header       Host       $host;
        proxy_set_header       X-Real-IP  $remote_addr;

        # Long timeouts for real-time game connection
        proxy_read_timeout     600s;
        proxy_send_timeout     600s;
        proxy_connect_timeout  10s;

        # Disable buffering (WebSocket is streaming)
        proxy_buffering        off;
    }
}
